# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - quantfin-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and validate dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r backend/requirements.txt
          echo "Dependencies installed successfully"

      # Deploy backend/ only — startup.sh lives at the root of this package.
      # SCM_DO_BUILD_DURING_DEPLOYMENT=true lets Oryx run pip install on Azure.
      # Without tensorflow this is now fast (~3-5 min instead of 15+ min).
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/
          exclude: |
            backend/venv/
            backend/__pycache__/
            backend/**/__pycache__/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1DE6CBF00CD0416C93DCDF862131E636 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6BB1CC63D6734DFAB7ED59858EDBBDB3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_57B564C8C1284B7A8721AF6FFD34891A }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'quantfin-backend'
          slot-name: 'Production'
          package: .

      - name: Configure Azure App Service settings
        run: |
          az webapp config set \
            --resource-group quantfin-rg \
            --name quantfin-backend \
            --startup-file "bash startup.sh"
          az webapp config appsettings set \
            --resource-group quantfin-rg \
            --name quantfin-backend \
            --settings \
              WEBSITES_PORT=8000 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              PYTHON_ENABLE_GUNICORN_MULTIWORKERS=false